name: Build WattappsAU APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Project
        run: |
          mkdir -p www assets
          echo "<h1>WattappsAU Loading...</h1>" > www/index.html
          npm install
          npm install -D @capacitor/assets
          npx cap init "WattappsAU" "mil.tniau.diskomlekau.wattappsau" --web-dir www
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "mil.tniau.diskomlekau.wattappsau",
              appName: "WattappsAU",
              webDir: "www",
              server: {
                url: "https://wa-iota-lemon.vercel.app",
                cleartext: true
              },
              android: {
                allowMixedContent: true,
                captureInput: true,
                webContentsDebuggingEnabled: true
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android
          fi

      - name: Configure Firebase FCM, KeepAliveService, Anti-Freeze WebView & Notifications
        run: |
          PKG_DIR="android/app/src/main/java/mil/tniau/diskomlekau/wattappsau"
          mkdir -p "$PKG_DIR"

          # 1. Tulis google-services.json langsung ke android/app/
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "373114469262",
              "project_id": "gen-lang-client-0858065140",
              "storage_bucket": "gen-lang-client-0858065140.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:373114469262:android:8149352219a89a0c5d82df",
                  "android_client_info": {
                    "package_name": "mil.tniau.diskomlekau.wattappsau"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDZlBHU-LemnGVJDz62t3e-eaumm0lYGmo"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 2. Suntik plugin & dependency Firebase Messaging ke Gradle
          node -e '
            const fs = require("fs");
            let rootGradle = fs.readFileSync("android/build.gradle", "utf8");
            if (!rootGradle.includes("com.google.gms:google-services")) {
              rootGradle = rootGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n        classpath \"com.google.gms:google-services:4.4.2\""
              );
              fs.writeFileSync("android/build.gradle", rootGradle);
            }

            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
            if (!appGradle.includes("com.google.gms.google-services")) {
              appGradle += "\napply plugin: \"com.google.gms.google-services\"\n";
            }
            if (!appGradle.includes("firebase-messaging")) {
              appGradle = appGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n    implementation \"com.google.firebase:firebase-messaging:24.0.3\""
              );
            }
            fs.writeFileSync("android/app/build.gradle", appGradle);
          '

          # 3. Buat WattappsFirebaseService.java (Menerima Push Notification saat aplikasi mati/layar terkunci)
          cat << 'EOF' > "$PKG_DIR/WattappsFirebaseService.java"
          package mil.tniau.diskomlekau.wattappsau;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.annotation.NonNull;
          import androidx.core.app.NotificationCompat;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import java.util.Map;

          public class WattappsFirebaseService extends FirebaseMessagingService {
              @Override
              public void onNewToken(@NonNull String token) {
                  super.onNewToken(token);
                  getSharedPreferences("wattappsau_prefs", MODE_PRIVATE)
                      .edit()
                      .putString("fcm_token", token)
                      .apply();
              }

              @Override
              public void onMessageReceived(@NonNull RemoteMessage remoteMessage) {
                  super.onMessageReceived(remoteMessage);
                  try {
                      Map<String, String> data = remoteMessage.getData();
                      String type = data.containsKey("type") ? data.get("type") : "message";
                      String sender = data.containsKey("sender") ? data.get("sender") : "WattappsAU";
                      String body = data.containsKey("body") ? data.get("body") : "Ada pesan atau panggilan masuk";

                      wakeScreen();
                      showPushNotification(type, sender, body);
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void wakeScreen() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isInteractive()) {
                          @SuppressWarnings("deprecation")
                          PowerManager.WakeLock wl = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "WattappsAU::FCMWake"
                          );
                          wl.acquire(15000);
                      }
                  } catch (Exception ignored) {}
              }

              private void showPushNotification(String type, String title, String body) {
                  boolean isCall = "call".equalsIgnoreCase(type);
                  String channelId = isCall ? "wattappsau_incoming_call_v3" : "wattappsau_incoming_msg_v3";
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;

                  Uri soundUri = isCall
                      ? RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      : RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          channelId,
                          isCall ? "Panggilan Masuk WattappsAU" : "Pesan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      ch.enableVibration(true);
                      ch.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      AudioAttributes attr = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(isCall ? AudioAttributes.USAGE_NOTIFICATION_RINGTONE : AudioAttributes.USAGE_NOTIFICATION)
                          .build();
                      ch.setSound(soundUri, attr);
                      nm.createNotificationChannel(ch);
                  }

                  try {
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createOneShot(isCall ? 1500 : 350, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(isCall ? 1500 : 350);
                          }
                      }
                  } catch (Exception ignored) {}

                  Intent intent = new Intent(this, MainActivity.class);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(
                      this, (int) System.currentTimeMillis(), intent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(isCall ? android.R.drawable.sym_call_incoming : android.R.drawable.stat_notify_chat)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(isCall ? NotificationCompat.CATEGORY_CALL : NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setSound(soundUri)
                      .setAutoCancel(true)
                      .setFullScreenIntent(pi, true)
                      .setContentIntent(pi);

                  nm.notify((int) System.currentTimeMillis(), builder.build());
              }
          }
          EOF

          # 4. Buat KeepAliveService.java
          cat << 'EOF' > "$PKG_DIR/KeepAliveService.java"
          package mil.tniau.diskomlekau.wattappsau;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class KeepAliveService extends Service {
              private PowerManager.WakeLock wakeLock;
              private static final String CHANNEL_ID = "wattappsau_keepalive";
              private static final int NOTIF_ID = 101;

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "WattappsAU Online Service",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          NotificationManager manager = getSystemService(NotificationManager.class);
                          if (manager != null) manager.createNotificationChannel(channel);
                      }
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "WattappsAU::KeepAlive");
                          wakeLock.acquire();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      Intent notifIntent = new Intent(this, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, 0, notifIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                      );

                      Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("WattappsAU • Siaga")
                          .setContentText("Terhubung untuk panggilan & pesan masuk")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      } else {
                          startForeground(NOTIF_ID, notification);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 5. Buat MainActivity.java (Mengambil FCM Token ke Web + Anti-Freeze WebView + Bridge)
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package mil.tniau.diskomlekau.wattappsau;

          import android.Manifest;
          import android.app.KeyguardManager;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.google.firebase.FirebaseApp;
          import com.google.firebase.messaging.FirebaseMessaging;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_PERMS = 1001;
              private static final String CALL_CHANNEL_ID = "wattappsau_incoming_call_v3";
              private static final String MSG_CHANNEL_ID = "wattappsau_incoming_msg_v3";
              private static final int CALL_NOTIF_ID = 202;
              private static int msgNotifCounter = 300;
              private Ringtone currentRingtone;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      FirebaseApp.initializeApp(this);
                      FirebaseMessaging.getInstance().getToken().addOnSuccessListener(token -> {
                          getSharedPreferences("wattappsau_prefs", MODE_PRIVATE)
                              .edit()
                              .putString("fcm_token", token)
                              .apply();
                      });
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  enableLockScreenDisplay();
                  createNotificationChannels();
                  setupWebViewPermissionsAndBridge();
                  checkAndRequestPermissions();
                  handleCallActionIntent(getIntent());
              }

              private void enableLockScreenDisplay() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      if (km != null) km.requestDismissKeyguard(this, null);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON |
                          WindowManager.LayoutParams.FLAG_DISMISS_KEYGUARD
                      );
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  if (bridge != null && bridge.getWebView() != null) {
                      bridge.getWebView().onResume();
                      bridge.getWebView().resumeTimers();
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleCallActionIntent(intent);
              }

              private void wakeScreenBriefly(long durationMs) {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null && !pm.isInteractive()) {
                          @SuppressWarnings("deprecation")
                          PowerManager.WakeLock screenLock = pm.newWakeLock(
                              PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP,
                              "WattappsAU::WakeScreen"
                          );
                          screenLock.acquire(durationMs);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void stopRingtoneAndVibration() {
                  try {
                      if (currentRingtone != null && currentRingtone.isPlaying()) currentRingtone.stop();
                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) v.cancel();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private void handleCallActionIntent(Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  String action = intent.getAction();
                  stopRingtoneAndVibration();
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(CALL_NOTIF_ID);

                  if ("ACTION_ANSWER_CALL".equals(action)) {
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().post(() ->
                              bridge.getWebView().evaluateJavascript("window.dispatchEvent(new CustomEvent('android-answer-call'));", null)
                          );
                      }
                  } else if ("ACTION_DECLINE_CALL".equals(action)) {
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().post(() ->
                              bridge.getWebView().evaluateJavascript("window.dispatchEvent(new CustomEvent('android-decline-call'));", null)
                          );
                      }
                  }
              }

              private void setupWebViewPermissionsAndBridge() {
                  if (bridge != null && bridge.getWebView() != null) {
                      WebView webView = bridge.getWebView();
                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                      CookieManager cookieManager = CookieManager.getInstance();
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(webView, true);

                      webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public String getFcmToken() {
                      return getSharedPreferences("wattappsau_prefs", MODE_PRIVATE)
                          .getString("fcm_token", "");
                  }

                  @JavascriptInterface
                  public void showIncomingCall(String callerName, String callType) {
                      runOnUiThread(() -> displayIncomingCallNotification(callerName, callType));
                  }

                  @JavascriptInterface
                  public void dismissIncomingCall() {
                      runOnUiThread(() -> {
                          stopRingtoneAndVibration();
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel(CALL_NOTIF_ID);
                      });
                  }

                  @JavascriptInterface
                  public void showIncomingMessage(String senderName, String messageText) {
                      runOnUiThread(() -> displayIncomingMessageNotification(senderName, messageText));
                  }
              }

              private void displayIncomingCallNotification(String callerName, String callType) {
                  wakeScreenBriefly(20000);
                  try {
                      Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      currentRingtone = RingtoneManager.getRingtone(getApplicationContext(), ringtoneUri);
                      if (currentRingtone != null) currentRingtone.play();

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          long[] pattern = {0, 800, 600, 800, 600};
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createWaveform(pattern, 0));
                          } else {
                              v.vibrate(pattern, 0);
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  Intent fullScreenIntent = new Intent(this, MainActivity.class);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent fullScreenPending = PendingIntent.getActivity(
                      this, 0, fullScreenIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent answerIntent = new Intent(this, MainActivity.class);
                  answerIntent.setAction("ACTION_ANSWER_CALL");
                  answerIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent answerPending = PendingIntent.getActivity(
                      this, 1, answerIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent declineIntent = new Intent(this, MainActivity.class);
                  declineIntent.setAction("ACTION_DECLINE_CALL");
                  declineIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent declinePending = PendingIntent.getActivity(
                      this, 2, declineIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  String title = (callerName != null && !callerName.isEmpty()) ? callerName : "Panggilan Masuk";
                  String text = "video".equalsIgnoreCase(callType) ? "Panggilan Video Masuk • WattappsAU" : "Panggilan Suara Masuk • WattappsAU";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setOngoing(true)
                      .setFullScreenIntent(fullScreenPending, true)
                      .addAction(android.R.drawable.ic_menu_call, "ANGKAT", answerPending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "TUTUP", declinePending);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(CALL_NOTIF_ID, builder.build());

                  try {
                      startActivity(fullScreenIntent);
                  } catch (Exception ignored) {}
              }

              private void displayIncomingMessageNotification(String senderName, String messageText) {
                  wakeScreenBriefly(5000);
                  try {
                      Uri notifUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                      Ringtone r = RingtoneManager.getRingtone(getApplicationContext(), notifUri);
                      if (r != null) r.play();

                      Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              v.vibrate(VibrationEffect.createOneShot(300, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(300);
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  Intent openIntent = new Intent(this, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent openPending = PendingIntent.getActivity(
                      this, msgNotifCounter, openIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  String title = (senderName != null && !senderName.isEmpty()) ? senderName : "Pesan Baru";
                  String body = (messageText != null && !messageText.isEmpty()) ? messageText : "Mengirim pesan";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, MSG_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.stat_notify_chat)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(new NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setContentIntent(openPending);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(msgNotifCounter++, builder.build());
              }

              private void createNotificationChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager == null) return;

                      Uri ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                      AudioAttributes callAudioAttr = new AudioAttributes.Builder()
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .build();

                      NotificationChannel callChannel = new NotificationChannel(
                          CALL_CHANNEL_ID,
                          "Panggilan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      callChannel.setDescription("Notifikasi layar penuh untuk panggilan masuk");
                      callChannel.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      callChannel.enableVibration(true);
                      callChannel.setSound(ringtoneUri, callAudioAttr);
                      manager.createNotificationChannel(callChannel);

                      NotificationChannel msgChannel = new NotificationChannel(
                          MSG_CHANNEL_ID,
                          "Pesan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      msgChannel.setDescription("Notifikasi pop-up pesan chat masuk");
                      msgChannel.setLockscreenVisibility(android.app.Notification.VISIBILITY_PUBLIC);
                      msgChannel.enableVibration(true);
                      manager.createNotificationChannel(msgChannel);
                  }
              }

              private void checkAndRequestPermissions() {
                  List<String> perms = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.CAMERA);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (!perms.isEmpty()) {
                      ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), REQ_PERMS);
                  } else {
                      startKeepAliveServiceSafe();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_PERMS) {
                      startKeepAliveServiceSafe();
                  }
              }

              private void startKeepAliveServiceSafe() {
                  try {
                      Intent serviceIntent = new Intent(this, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
