name: Build WattappsAU APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Project
        run: |
          mkdir -p www
          echo "<h1>WattappsAU Loading...</h1>" > www/index.html
          npm install
          npx cap init "WattappsAU" "id.diskomlekau.wattappsau" --web-dir www
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "id.diskomlekau.wattappsau",
              appName: "WattappsAU",
              webDir: "www",
              server: {
                url: "https://wa-iota-lemon.vercel.app",
                cleartext: true
              }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android

      - name: Inject KeepAliveService, CallNotification & Camera Permissions
        run: |
          PKG_DIR="android/app/src/main/java/id/diskomlekau/wattappsau"
          mkdir -p "$PKG_DIR"

          # 1. Buat KeepAliveService.java
          cat << 'EOF' > "$PKG_DIR/KeepAliveService.java"
          package id.diskomlekau.wattappsau;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class KeepAliveService extends Service {
              private PowerManager.WakeLock wakeLock;
              private static final String CHANNEL_ID = "wattappsau_keepalive";
              private static final int NOTIF_ID = 101;

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          NotificationChannel channel = new NotificationChannel(
                              CHANNEL_ID,
                              "WattappsAU Online Service",
                              NotificationManager.IMPORTANCE_LOW
                          );
                          NotificationManager manager = getSystemService(NotificationManager.class);
                          if (manager != null) manager.createNotificationChannel(channel);
                      }
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "WattappsAU::KeepAlive");
                          wakeLock.acquire();
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  try {
                      Intent notifIntent = new Intent(this, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                          this, 0, notifIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                      );

                      Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("WattappsAU • Online")
                          .setContentText("Koneksi P2P & panggilan siap di latar belakang")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(pendingIntent)
                          .setOngoing(true)
                          .build();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                      } else {
                          startForeground(NOTIF_ID, notification);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # 2. Buat MainActivity.java dengan Izin Kamera + Mikrofon + Notifikasi Panggilan Masuk (Angkat/Tutup)
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package id.diskomlekau.wattappsau;

          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.annotation.NonNull;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_PERMS = 1001;
              private static final String CALL_CHANNEL_ID = "wattappsau_incoming_call";
              private static final int CALL_NOTIF_ID = 202;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Izinkan layar menyala saat ada panggilan masuk
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O_MR1) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED |
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      );
                  }

                  createCallChannel();
                  setupWebViewPermissionsAndBridge();
                  checkAndRequestPermissions();
                  handleCallActionIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleCallActionIntent(intent);
              }

              private void handleCallActionIntent(Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  String action = intent.getAction();
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.cancel(CALL_NOTIF_ID);

                  if ("ACTION_ANSWER_CALL".equals(action)) {
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().post(() ->
                              bridge.getWebView().evaluateJavascript("window.dispatchEvent(new CustomEvent('android-answer-call'));", null)
                          );
                      }
                  } else if ("ACTION_DECLINE_CALL".equals(action)) {
                      if (bridge != null && bridge.getWebView() != null) {
                          bridge.getWebView().post(() ->
                              bridge.getWebView().evaluateJavascript("window.dispatchEvent(new CustomEvent('android-decline-call'));", null)
                          );
                      }
                  }
              }

              private void setupWebViewPermissionsAndBridge() {
                  if (bridge != null && bridge.getWebView() != null) {
                      bridge.getWebView().addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                      bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void showIncomingCall(String callerName, String callType) {
                      runOnUiThread(() -> displayIncomingCallNotification(callerName, callType));
                  }

                  @JavascriptInterface
                  public void dismissIncomingCall() {
                      runOnUiThread(() -> {
                          NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm != null) nm.cancel(CALL_NOTIF_ID);
                      });
                  }
              }

              private void displayIncomingCallNotification(String callerName, String callType) {
                  Intent fullScreenIntent = new Intent(this, MainActivity.class);
                  fullScreenIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent fullScreenPending = PendingIntent.getActivity(
                      this, 0, fullScreenIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent answerIntent = new Intent(this, MainActivity.class);
                  answerIntent.setAction("ACTION_ANSWER_CALL");
                  answerIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent answerPending = PendingIntent.getActivity(
                      this, 1, answerIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  Intent declineIntent = new Intent(this, MainActivity.class);
                  declineIntent.setAction("ACTION_DECLINE_CALL");
                  declineIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent declinePending = PendingIntent.getActivity(
                      this, 2, declineIntent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                  );

                  String title = (callerName != null && !callerName.isEmpty()) ? callerName : "Panggilan Masuk";
                  String text = "video".equalsIgnoreCase(callType) ? "Panggilan Video Masuk • WattappsAU" : "Panggilan Suara Masuk • WattappsAU";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setAutoCancel(true)
                      .setOngoing(true)
                      .setFullScreenIntent(fullScreenPending, true)
                      .addAction(android.R.drawable.ic_menu_call, "ANGKAT", answerPending)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "TUTUP", declinePending);

                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(CALL_NOTIF_ID, builder.build());
              }

              private void createCallChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CALL_CHANNEL_ID,
                          "Panggilan Masuk WattappsAU",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      channel.setDescription("Notifikasi layar penuh untuk panggilan masuk");
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              private void checkAndRequestPermissions() {
                  List<String> perms = new ArrayList<>();
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.RECORD_AUDIO);
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      perms.add(Manifest.permission.CAMERA);
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                  }
                  if (!perms.isEmpty()) {
                      ActivityCompat.requestPermissions(this, perms.toArray(new String[0]), REQ_PERMS);
                  } else {
                      startKeepAliveServiceSafe();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_PERMS) {
                      startKeepAliveServiceSafe();
                  }
              }

              private void startKeepAliveServiceSafe() {
                  try {
                      Intent serviceIntent = new Intent(this, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent);
                      } else {
                          startService(serviceIntent);
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          # 3. Sisipkan izin Kamera, FullScreenIntent & service ke AndroidManifest.xml
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            const perms = `
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
            `;
            const service = `
              <service
                  android:name=".KeepAliveService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="dataSync" />
            `;
            xml = xml.replace("<application", perms + "\n    <application");
            xml = xml.replace("</application>", service + "\n    </application>");
            fs.writeFileSync(path, xml);
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WattappsAU-KeepAlive-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
